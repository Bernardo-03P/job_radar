name: CI Pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: audit-only-local
          POSTGRES_DB: job_radar_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_radar_audit"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:audit-only-local@127.0.0.1:5432/job_radar_audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - run: python scripts/check_publish.py
      - run: ruff check backend agent scripts
      - run: bandit -r backend/app backend/main.py agent scripts -q -ll
      - run: pip-audit --disable-pip --no-deps -r backend/requirements-dev.lock.txt
      - run: pytest backend/tests -v -c backend/pyproject.toml
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
